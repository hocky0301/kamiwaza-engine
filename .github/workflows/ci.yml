name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  stats:
    # 記事・READMEの統計値(95%CI・値精度・キャッシュ内訳)を実測ログから再計算して検証する。
    # 数字が主張とずれたらCIが赤になる=「凍結値の照合」を機械に固定する
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mypy
      - run: mypy --strict tools/verify_stats.py
      - run: python3 tools/verify_stats.py
