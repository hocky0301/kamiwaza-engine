name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  claims:
    # 対外主張を機械で検証する層。設定は pyproject.toml に集約(CIとローカルで同じ判定になる)。
    #   ruff   … lint と format の一致
    #   mypy   … --strict(設定は pyproject.toml)
    #   pytest … 検証スクリプト自身のテスト(Clopper-Pearson 実装の恒等式・境界)
    #   verify_stats.py … 記事・READMEの統計値を一次ログから再計算。ずれたら赤
    #   check_deck.py   … ピッチの凍結値の一致と禁句の不在。違反したら赤
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # バージョンは固定する(ツールが上がった日にCIが勝手に壊れないように)
      - run: pip install ruff==0.16.3 mypy==2.3.0 pytest==9.1.1
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: python3 tools/verify_stats.py
      # pitch/ は公開リポジトリに含めない裁定のため、存在するときだけ検査する
      # (作業リポジトリでは必ず走り、公開スナップショットでは自動でスキップ)
      - run: if [ -f pitch/check_deck.py ]; then python3 pitch/check_deck.py; else echo "pitch/ なし(公開リポジトリ) → スキップ"; fi
